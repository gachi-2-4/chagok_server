spring:
  application:
    name: chagok_server
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/chagok}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}

auth:
  jwt:
    secret: ${JWT_SECRET}
  sms:
    hash-secret: ${SMS_HASH_SECRET}
    twilio:
      account-sid: ${TWILIO_ACCOUNT_SID}
      auth-token: ${TWILIO_AUTH_TOKEN}
      from: ${TWILIO_FROM}
  oauth:
    kakao:
      client-id: ${KAKAO_CLIENT_ID}
      # 카카오 디벨로퍼스의 앱 ID(숫자). 다른 앱에서 발급된 액세스 토큰을 거부하는 데 사용한다.
      app-id: ${KAKAO_APP_ID}
      client-secret: ${KAKAO_CLIENT_SECRET:}
      redirect-uri: ${KAKAO_REDIRECT_URI}
    google:
      client-id: ${GOOGLE_CLIENT_ID}
      client-secret: ${GOOGLE_CLIENT_SECRET}
      redirect-uri: ${GOOGLE_REDIRECT_URI}

chagok:
  internal:
    # 내부 서비스 간 호출(X-Internal-Key 헤더) 인증 키
    key: ${CHAGOK_INTERNAL_KEY}
